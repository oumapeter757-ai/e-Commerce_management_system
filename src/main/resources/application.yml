spring:
  application:
    name: ecommerce_management_system

  # DATABASE CONFIGURATION
  datasource:
    # Now uses variables from .env
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EcommerceHikariPool

  # FLYWAY CONFIGURATION
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: false

  # REDIS CONFIGURATION
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 60000
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: true
    open-in-view: false

  # CACHE CONFIGURATION (TTLs managed in RedisConfig.java)
  cache:
    type: redis

  # EMAIL CONFIGURATION (SECURE)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: false
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    default-encoding: UTF-8

  # SERVLET CONFIGURATION
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      include-binding-errors: always
      include-message: always
      include-stacktrace: never

# SERVER CONFIGURATION
server:
  forward-headers-strategy: framework
  port: 8080
  compression:
    enabled: true

# LOGGING CONFIGURATION
logging:
  level:
    root: INFO
    com.peterscode.ecommerce_management_system: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ecommerce-app.log
    max-size: 10MB
    max-history: 30

# APPLICATION SPECIFIC CONFIGURATION
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000       # 1 hour
    refresh-token-expiration: 604800000    # 7 days

  # Security Configuration
  security:
    max-login-attempts: 5
    account-lock-duration: 1800000         # 30 minutes
    password-reset-token-expiration: 3600000  # 1 hour

  # CORS Configuration
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,https://*.ngrok-free.app
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # Frontend URL
  frontend:
    url: ${FRONTEND_URL}

# SPRINGDOC / SWAGGER CONFIGURATION
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true

# ACTUATOR CONFIGURATION
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ==========================================
# M-PESA SANDBOX CONFIGURATION
# ==========================================
mpesa:
  api:
    url: https://sandbox.safaricom.co.ke

  consumer:
    key: ${MPESA_CONSUMER_KEY}
    secret: ${MPESA_CONSUMER_SECRET}

  shortcode: ${MPESA_SHORTCODE}
  passkey: ${MPESA_PASSKEY}

  callback:
    url: ${FRONTEND_URL}
    secret: ${MPESA_CALLBACK_SECRET}

  oauth:
    endpoint: /oauth/v1/generate?grant_type=client_credentials

  stk-push:
    endpoint: /mpesa/stkpush/v1/processrequest

  # SECURITY SETTINGS
  security:
    allowed-ips: 196.201.214.200,196.201.214.206,196.201.213.114,196.201.214.207,196.201.214.208,196.201.213.44,196.201.212.127,196.201.212.128,196.201.212.129,196.201.212.136,196.201.212.138,196.201.214.130
    validate-callback-ip: true
    verify-signature: false
# PAYMENT LIMITS
payment:
  min-amount: 1
  max-amount: 150000
  require-full-payment: true